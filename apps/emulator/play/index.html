<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlayStation 2</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:#000;color:#eee;font:14px "Segoe UI",system-ui,sans-serif}
    body{display:flex;flex-direction:column;align-items:center}
    #toolbar{width:min(100%,960px);min-height:44px;padding:6px 10px 6px 96px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    #rom{max-width:100%;font:inherit}
    #status{color:#bbb;overflow-wrap:anywhere}
    #fps{color:#9aa;white-space:nowrap}
    #outputCanvas{width:min(100vw,calc((100vh - 44px)*4/3));height:auto;max-height:calc(100vh - 44px);aspect-ratio:4/3;object-fit:contain;background:#000}
  </style>
</head>
<body>
  <div id="toolbar">
    <input id="rom" type="file" accept=".iso,.cso,.chd,.isz,.bin,.elf">
    <span id="status" role="status" aria-live="polite">Starting Play!…</span>
    <span id="fps" aria-live="off">FPS: --</span>
  </div>
  <canvas id="outputCanvas" width="640" height="480" tabindex="0" aria-label="PlayStation 2 game screen"></canvas>
  <script type="module" src="adapter.js"></script>
</body>
</html>
